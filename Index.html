<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14232d">
<meta name="description" content="Food missions, stories, little notes and unexpected discoveries at Drydens Deck.">
<title>Drydens Deck</title>
<style>
:root{--ink:#14232d;--ink2:#263c49;--muted:#667987;--blue:#9fd8f2;--blue2:#55b6df;--teal:#79d6ce;--paper:#f4f8fb;--white:#fff;--line:rgba(20,35,45,.10);--shadow:0 18px 48px rgba(23,48,64,.12);--r:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.42;min-height:100vh;min-height:100svh}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue2);outline-offset:3px}button:disabled{opacity:.6;cursor:default}.shell{width:min(1180px,calc(100% - 32px));margin-inline:auto}
.topbar{height:64px;display:flex;align-items:center;position:sticky;top:0;z-index:15;background:rgba(244,248,251,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.nav{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;min-width:0}.brand-mark{height:39px;width:39px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--teal));font-size:1.08rem;font-weight:950;box-shadow:0 7px 20px rgba(85,182,223,.2)}.brand-name{font-size:1rem;line-height:1.02;font-weight:930;letter-spacing:-.045em}.brand-sub{display:block;color:var(--muted);font-size:.61rem;letter-spacing:.115em;text-transform:uppercase;font-weight:800;margin-top:5px}.nav-right{display:flex;align-items:center;gap:8px}.nav-pill{display:flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#38505d;font-size:.77rem;font-weight:850;white-space:nowrap}.nav-pill b{color:#1485ad}.nav-memory{border:0;background:var(--ink);color:white;padding:9px 14px;border-radius:999px;font-weight:850;font-size:.78rem;white-space:nowrap}
main{padding:14px 0 28px}.hero{position:relative;isolation:isolate;overflow:hidden;min-height:292px;border-radius:29px;padding:30px 34px;display:flex;align-items:center;color:white;background:radial-gradient(ellipse at 8% 100%,rgba(85,182,223,.32),transparent 38%),radial-gradient(ellipse at 80% 0%,rgba(121,214,206,.20),transparent 35%),linear-gradient(112deg,#12212b,#233e4b 72%,#245361);box-shadow:0 20px 48px rgba(20,35,45,.15)}.hero:before{content:"";position:absolute;z-index:-1;right:-5%;top:-72%;width:480px;height:480px;border:1px solid rgba(255,255,255,.10);border-radius:50%;box-shadow:0 0 0 34px rgba(255,255,255,.018),0 0 0 76px rgba(255,255,255,.014)}.hero-copy{position:relative;z-index:2;width:68%;max-width:670px;padding-right:260px}.eyebrow{color:#bfeafa;text-transform:uppercase;letter-spacing:.15em;font-weight:900;font-size:.67rem;display:flex;align-items:center;gap:8px}.eyebrow:before{content:"";width:21px;height:2px;background:var(--teal);border-radius:4px}h1{font-size:clamp(3rem,6.4vw,5rem);line-height:.91;letter-spacing:-.078em;margin:14px 0 13px;font-weight:950}.hero-copy p{font-size:.96rem;color:rgba(255,255,255,.79);max-width:430px;line-height:1.48;margin:0 0 19px}.hero-actions{display:flex;flex-wrap:wrap;gap:8px}.btn{border:0;border-radius:999px;padding:11px 16px;font-size:.83rem;font-weight:870;transition:transform .18s,filter .18s,box-shadow .18s}.btn:hover{transform:translateY(-2px);filter:brightness(1.02)}.btn-bright{background:linear-gradient(135deg,var(--blue),var(--teal));color:#132630;box-shadow:0 8px 20px rgba(0,0,0,.14)}.btn-glass{background:rgba(255,255,255,.09);color:white;border:1px solid rgba(255,255,255,.24)}.cover-frame{position:absolute;z-index:2;right:clamp(24px,5vw,65px);top:50%;transform:translateY(-50%);width:220px;height:268px;padding:6px;border:1px solid rgba(255,255,255,.45);border-radius:21px;background:rgba(255,255,255,.94);box-shadow:0 18px 40px rgba(0,0,0,.29)}.cover-frame img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;border-radius:15px;background:#d8e7ed}.hero-badge{position:absolute;z-index:3;right:clamp(285px,27vw,330px);bottom:18px;background:rgba(13,29,38,.75);border:1px solid rgba(255,255,255,.17);border-radius:999px;padding:6px 10px;font-size:.64rem;color:#eafaff;font-weight:800;letter-spacing:.06em;backdrop-filter:blur(8px)}
.login-wrap{max-width:440px;margin:80px auto;background:#fff;padding:32px;border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow);text-align:center}.login-wrap h2{margin:10px 0 8px;font-size:1.6rem}.login-wrap p{color:var(--muted);font-size:.85rem;margin-bottom:24px}.login-input{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:12px;font-size:1rem;text-align:center;margin-bottom:14px;letter-spacing:.05em}.login-btn{width:100%;padding:12px;background:var(--ink);color:white;border:0;border-radius:12px;font-weight:850;font-size:.9rem}
.hidden{display:none !important}
</style>
</head>
<body>

<div id="loginView" class="shell">
  <div class="login-wrap">
    <h2>Drydens Deck</h2>
    <p>Enter your private access code to enter.</p>
    <input type="text" id="accessCodeInput" class="login-input" placeholder="DD-XXXX-XXXX-XXXX" autocomplete="off">
    <button onclick="handleLogin()" class="login-btn">Unlock Deck</button>
    <div id="loginError" style="color:#d9534f;font-size:0.8rem;margin-top:10px;"></div>
  </div>
</div>

<div id="appView" class="shell hidden">
  <header class="topbar">
    <div class="shell nav">
      <div class="brand">
        <div class="brand-mark">D</div>
        <div>
          <span class="brand-name">Drydens Deck</span>
          <span class="brand-sub" id="userWelcome">Private Space</span>
        </div>
      </div>
      <div class="nav-right">
        <button onclick="handleLogout()" class="nav-memory" style="background:#e6f6fc;color:var(--ink);">Lock Out</button>
      </div>
    </div>
  </header>
  <main>
    <section class="hero">
      <div class="hero-copy">
        <div class="eyebrow">Our Private Sanctuary</div>
        <h1>Memories & Shared Stories</h1>
        <p>Everything saved here goes straight to our private Google Sheet. Fully secure, permanent, and private.</p>
      </div>
    </section>
  </main>
</div>

<script>
// REPLACE WITH YOUR APPS SCRIPT WEB APP /exec URL:
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw9nYOuFgJNZ3Fwrb27x0ZqeWwJniVtcKCkZ06x0EEGGu1v-kT_rPWgFoi9gTJutsZUJg/exec";

function callServer(method, ...args) {
  return fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ method: method, args: args })
  })
  .then(res => res.json())
  .catch(err => ({ ok: false, error: err.message }));
}

async function handleLogin() {
  const code = document.getElementById('accessCodeInput').value.trim();
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if (!code) { errEl.textContent = 'Please enter your access code.'; return; }
  
  const res = await callServer('ddLogin', code, navigator.userAgent);
  if (res && res.ok) {
    localStorage.setItem('dd_token', res.token);
    initApp(res.name);
  } else {
    errEl.textContent = res.locked ? 'Too many attempts. Try again later.' : 'Invalid access code.';
  }
}

async function checkExistingSession() {
  const token = localStorage.getItem('dd_token');
  if (!token) return;
  const res = await callServer('ddValidateSession', token);
  if (res && res.ok) {
    initApp(res.name);
  } else {
    localStorage.removeItem('dd_token');
  }
}

function initApp(name) {
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('userWelcome').textContent = 'Logged in as ' + name;
}

function handleLogout() {
  const token = localStorage.getItem('dd_token');
  if (token) callServer('ddLogout', token);
  localStorage.removeItem('dd_token');
  document.getElementById('appView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('accessCodeInput').value = '';
}

window.addEventListener('DOMContentLoaded', checkExistingSession);
</script>
</body>
</html>
